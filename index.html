<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Victoria Travel Collection</title>
    <meta
      name="description"
      content="Victoria 的旅遊網站總整理，收錄東京、首爾、澳洲、日本東北、美西、印尼與英國旅行手冊，作為統一入口首頁。"
    />
    <meta name="theme-color" content="#7a8a95" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <nav class="topbar">
          <div class="brand">
            <span class="brand-mark">V</span>
            <div>
              <p class="eyebrow" data-i18n="brandEyebrow">Victoria Travel Archive</p>
              <p class="brand-title" data-i18n="brandTitle">旅遊網站總整理</p>
            </div>
          </div>
          <div class="lang-switcher" role="group" aria-label="Language switcher">
            <button class="lang-btn active" type="button" data-lang="zh">中</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
        </nav>

        <div class="hero-layout">
          <section class="hero-copy">
            <p class="eyebrow" data-i18n="heroEyebrow">Travel guide collection</p>
            <h1 data-i18n="heroTitle">把走過的城市與風景，安放在同一頁裡。</h1>
            <p class="hero-lead" data-i18n="heroLead">
              這是 Victoria 將自己的旅遊手冊整理成網站之後，再進一步彙整而成的總覽網站，讓你可以從同一個入口走進不同地方的旅程。
            </p>
            <div class="hero-highlights">
              <span>Tokyo</span>
              <span>Seoul</span>
              <span>Australia</span>
              <span>Tohoku</span>
              <span>USA West</span>
              <span>UK</span>
              <span>Bali × Java</span>
            </div>
          </section>
        </div>
      </header>

      <main>
        <section class="intro">
          <p class="eyebrow" data-i18n="introEyebrow">Browse by destination</p>
          <h2 data-i18n="introTitle">依著你此刻想念的地方，走進那一段旅程。</h2>
        </section>

        <section class="collection-section" id="collection">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="collectionEyebrow">Collection</p>
            <h2 data-i18n="collectionTitle">Explore the journeys</h2>
          </div>
          <div class="collection-grid" id="cards"></div>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
