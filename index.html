<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Victoria's Travel Library</title>
    <meta
      name="description"
      content="Victoria 的旅行手冊收藏，收錄東京、首爾、澳洲、日本東北、美西、印尼與英國的旅程入口。"
    />
    <meta name="theme-color" content="#d8c7b5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero" id="top">
        <nav class="topbar">
          <div class="brand">
            <span class="brand-mark">V</span>
            <div>
              <p class="eyebrow" data-i18n="brandEyebrow">Victoria Travel Archive</p>
              <p class="brand-title" data-i18n="brandTitle">旅遊網站總整理</p>
            </div>
          </div>
          <div class="lang-switcher" role="group" aria-label="Language switcher">
            <button class="lang-btn active" type="button" data-lang="zh">中</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
        </nav>

        <div class="hero-layout">
          <section class="hero-copy">
            <div class="hero-main">
              <p class="eyebrow" data-i18n="heroEyebrow">Travel guide collection</p>
              <h1 data-i18n="heroTitle">把走過的城市與風景，安放在同一頁裡。</h1>
              <p class="hero-lead" data-i18n="heroLead">
                這是 Victoria 將自己的旅遊手冊整理成網站之後，再進一步彙整而成的總覽網站，讓你可以從同一個入口走進不同地方的旅程。
              </p>
              <div class="hero-actions">
                <a class="hero-cta" href="#collection" data-i18n="heroCta">瀏覽旅程</a>
              </div>
            </div>
          </section>
        </div>
      </header>

      <main>
        <section class="collection-section" id="collection">
          <div class="section-heading">
            <div class="section-heading-copy">
              <p class="eyebrow" data-i18n="collectionEyebrow">Collection</p>
              <h2 data-i18n="collectionTitle">Explore the journeys</h2>
            </div>
            <p class="section-heading-note" data-i18n="collectionLead">依出發日期排序，從最近寫下的旅程，一路翻到更早的地方。</p>
          </div>
          <div class="collection-grid" id="cards"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p class="site-footer-copy" data-i18n="footerCopy">Victoria Travel Archive</p>
        <a class="site-footer-link" href="#top" data-i18n="footerBackToTop">回到上方</a>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
